<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090705"><title>Um convite especial | Essência &amp; Toque</title>
<style>
:root{color-scheme:dark;--gold:#d7a45c}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at center,#24180d 0%,#090705 70%);color:#f8eddb;font-family:Georgia,'Times New Roman',serif}
body{display:grid;place-items:center;padding:20px}.stage{width:min(100%,560px);text-align:center}
.kicker{color:#d9bd91;font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin:0 0 12px}
h1{font-size:clamp(28px,7vw,46px);font-weight:400;font-style:italic;margin:0 0 8px;color:#e6b873}
.instruction{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#f4e5cf;margin:0 0 22px}
.scene{position:relative;perspective:1200px;min-height:260px;display:grid;place-items:center}
.envelope-button{position:relative;width:min(100%,430px);aspect-ratio:1.55;border:1px solid #d7a45c99;border-radius:3px;background:linear-gradient(145deg,#21160f,#080706 72%);box-shadow:0 24px 70px #000b,inset 0 0 30px #b57a3020;cursor:pointer;padding:0;overflow:visible;transition:opacity .6s,transform .8s}
.envelope-button:focus-visible{outline:2px solid #e6b873;outline-offset:6px}
.envelope-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2}
.seal{width:78px;height:78px;border:1px solid #d9a95f;border-radius:50%;display:grid;place-items:center;color:#e3b56d;font-size:34px;box-shadow:0 0 0 5px #090705,0 0 0 6px #7f562b;background:radial-gradient(circle,#3b2815,#100b07)}
.envelope-name{color:#f0d6aa;font-size:10px;letter-spacing:.28em;text-transform:uppercase}
.flap{position:absolute;z-index:3;left:0;top:0;width:100%;height:62%;transform-origin:top center;background:linear-gradient(150deg,#3a281a,#130d08 80%);clip-path:polygon(0 0,100% 0,50% 100%);border-top:1px solid #b88342;transition:transform 1s cubic-bezier(.2,.7,.15,1),opacity .8s}
.hint{margin-top:18px;color:#e1b36e;font-size:10px;letter-spacing:.25em;text-transform:uppercase}
.card{display:none;opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s;margin:0 auto;width:min(100%,560px)}
.card img{display:block;width:100%;height:auto;border:1px solid #c99a57;box-shadow:0 22px 65px #000b}
.open .flap{transform:rotateX(180deg);opacity:0}.open .envelope-button{display:none}
.open .scene{display:block;min-height:0}.open .card{display:block;width:min(100%,560px);margin:0 auto;animation:reveal .8s .12s forwards}.open .card img{width:100%;height:auto}.open .hint{display:none}
.open h1,.open .instruction{display:none}
@keyframes reveal{to{opacity:1;transform:translateY(0) scale(1)}}
.note{margin:18px auto 0;max-width:400px;color:#cbb99f;font-size:12px;line-height:1.7}.open .note{display:none}
.reset{margin-top:18px;border:1px solid #8c683c;background:transparent;color:#e7c38e;padding:10px 15px;letter-spacing:.12em;font-size:10px;text-transform:uppercase;cursor:pointer}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head>
